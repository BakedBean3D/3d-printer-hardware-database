# Mean Well switching power supplies commonly used in 3D printer electronics bays.
# Mounting dimensions for parametric CAD. null = unknown (do not assume 0).
#
# Every unit in this file exposes TWO possible mounting patterns per Mean Well's
# own mechanical drawings:
#   - bottom_mount_*  = the vertical-entry hole pattern used for flat/plate mounting
#                       (screws perpendicular to the case's large flat face). This is
#                       the pattern almost every printer enclosure/mount design uses.
#   - side_mount_*    = the SECOND documented pattern. On LRS-200/LRS-350/RSP-500 this
#                       is a true horizontal side-wall entry (Mean Well labels it
#                       "(Both Sides)" in the drawing). On LRS-50/LRS-100/LRS-150 Mean
#                       Well does not offer a horizontal side-wall pattern at all --
#                       the second pattern is a second *vertical* pattern on the
#                       opposite face (the top flange, near the terminal block/LED),
#                       usable for an L-bracket. Read each record's `notes` for which
#                       physical face is meant -- do not assume "side" always means
#                       "horizontal entry."
#
# Hole diameters are frequently not explicitly dimensioned on the vendor drawing for
# the M4 (and larger) series -- where that's true, mount_*_hole_dia_mm is INFERRED
# from standard clearance-hole practice (M3->3.2, matching this repo's
# controller_boards convention; here M3->3.5 and M4->4.5 where measured/labelled
# diameters were not printed) and is flagged as inferred, not measured, in notes.
#
# Exact mount_*_holes_xy coordinate lists are populated ONLY where the vendor
# mechanical drawing gave clean, cross-validated (symmetric, arithmetic-checked)
# dimensions. Where the drawing's dimension chain could not be resolved with
# confidence from the published PDF, the field is left null rather than guessed --
# extract the exact XY from the vendor's 3D STEP/DXF (linked in `sources`) before
# cutting anything that depends on those coordinates.

