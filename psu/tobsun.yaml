# TOBSUN DC-DC step-down converters (12/24 V in, low-voltage out). Mounting
# dimensions for parametric CAD. null = unknown (do not assume 0).
#
# category dc_dc_converter: a low-voltage DC-in module, not a mains supply.
# Consumers may treat it differently from mains units (e.g. tape mounting).
#
# Frame (EA50-5V): mount_hole_frame is case_corner. x runs along the case length
# L with x=0 at the TERMINAL end of the recorded body, which includes the barrier
# terminal block (length_mm 52.8 = 7.0 mm terminal block + 2.5 mm of case
# + the 26.3 mm hole-row pitch + 17 mm of case, owner-measured); y runs across the width W,
# the 50 mm case centred between the ears, so the side-ear holes sit 3.5 mm
# outside the case. The record states that with mount_footprint_mm (x over the
# 52.8 mm body, y over the 63.73 mm ear tip-to-tip span centred on the 50 mm
# case); the validator admits the off-case holes because they lie inside it.
# The schema has no separate case-vs-terminal-block box: the body is the 52.8 mm
# envelope.

- id: tobsun_ea50_5v
  name: TOBSUN EA50-5V
  manufacturer: TOBSUN
  series: EA50
  category: dc_dc_converter
  mount_locations: [bay, frame]
  length_mm: 52.8
  width_mm: 50.0
  height_mm: 20.15
  weight_g: null
  wattage_w: 50
  output_voltages_v: [5]
  bottom_mount_screw: M3
  bottom_mount_interface: clearance_ears
  bottom_mount_hole_dia_mm: null
  bottom_mount_hole_count: 4
  bottom_mount_pattern: other
  bottom_mount_pitch_x_mm: 26.3
  bottom_mount_pitch_y_mm: null
  bottom_mount_holes_xy: [[9.5, 4.0], [9.5, 46.0], [35.8, -3.5], [35.8, 53.5]]
  bottom_mount_max_penetration_mm: null
  bottom_mount_slot_travel_mm: 0.0
  side_mount_screw: null
  side_mount_hole_dia_mm: null
  side_mount_hole_count: null
  side_mount_pattern: none
  side_mount_pitch_x_mm: null
  side_mount_holes_xy: null
  side_mount_max_penetration_mm: null
  din_rail_compatible: false
  din_rail_type: null
  terminal_location: 4-position barrier terminal block, 34.3 mm wide, at one end of the case length,
    between the terminal-end slot pair (x = 0 row). Screws face up; wires enter along L from that end.
  terminal_faces:
  - face: x_min_end
    circuits: [dc_in, dc_out]
    notes: One 4-position barrier block carries both input and output (owner calipers give its
      34.3 mm width; block type, screw-up orientation and end wire entry are render-estimated from
      Printables 698606). Pin order IN+/IN-/OUT-/OUT+ is not recorded; read the label on the case.
  mount_hole_frame: case_corner
  mount_footprint_mm: {x_min: 0.0, x_max: 52.8, y_min: -6.865, y_max: 56.865}
  connector_notes: 4-position barrier terminal block (input 12/24 V DC nominal per listings, exact range
    unpublished; output 5 V). No datasheet found 2026-10-01.
  sources:
  - Owner calipers on his unit, 2026-10-01 (body 52.8 L x 50 W x 20.15 H mm; ears 63.73 mm edge to edge
    across W; terminal block 34.3 mm wide; slots left and right of the terminals)
  - https://www.printables.com/model/420640-tobsun-5v-dc-converter-mount-for-din-rail-bracket (mmuellerphoto,
    CC BY; STEP "Tobsun 5V DEC Converter DIN Rail Racket Mount.step" sha256
    7fbd50b2c63f4b1d4f10b11b04b9ef530393689ab9a42d3bd78b0b2f1460c1b0, measured 2026-10-01 by OCCT
    cylinder-axis extraction)
  - https://www.printables.com/model/698606-tobsun-ea25ea50-5v-din-rail-mount (Artxime, GPL-3; renders only,
    terminal block form)
  - https://spool3d.ca/tobsun-50w-dc-dc-converter/ (listing; 6.3 x 5.2 x 1.8 cm, 50 W, 90 %, 80 C max)
  confidence: medium
  notes: 'Confidence medium. Body from owner calipers (2026-10-01). Hole pattern from the four M3
    boss/clearance-hole axes of a community bracket STEP (Printables 420640, CC BY), which seats the
    converter on four 2 mm bosses: side-ear pair 57.0 mm apart across W, terminal-end pair 42.0 mm
    apart, the rows 26.3 mm apart along L. Cross-checks: the side-ear pair (57.0 mm hole-to-hole) agrees with the owner''s
    63.73 mm ear tip-to-tip span (slot centres about 3.4 mm in from each ear tip); the terminal-end pair sits
    about 3.9 mm outside each side of the owner''s 34.3 mm terminal block, matching his "slots ... left
    and right of terminals". A second community bracket of unknown source (not cited) agrees on 42.0
    and the row pitch (26.44) and gives 56.68 for the side pair, a 0.32 mm disagreement recorded here
    rather than averaged. bottom_mount_slot_travel_mm 0.0 credits no slot travel: the
    recorded centres are the reference bracket''s screw axes; the slot length is unmeasured. Unknown: slot width/length (oval at the terminal end per renders), flange
    thickness, weight, input range, the case body offset along L from the holes (owner measurement below, end not identified), pin order. One
    listing (698606) covers the EA25 too; the EA25 pattern is not recorded. A printed hole-gauge
    coupon against the owner''s unit is the first fit check.
    mount_locations (added 2026-10-10): bay and frame. The case carries 4 x M3 bottom mount holes (open clearance ears, other pattern, recorded above), the chassis-mounting feature of this unit, so it fastens to a plate in the bay or to a bracket or upright on a printer frame. The frame value rests on those recorded mounting holes and on the owner''s Partsmith decisions of 2026-09-24 and 2026-09-30 (a supply may hang on the frame by Partsmith''s upright mount or the builder''s own bracket); it is not a vendor statement about extrusions.
    Owner calipers, 2026-10-11 (frame, mount_hole_frame case_corner): from the centre of a mounting hole to the end of the
    metal case along L, 17 mm on the non-terminal end and 2.5 mm on the terminal end. The metal case is therefore
    17 + 26.3 (row pitch) + 2.5 = 45.8 mm, and the remaining 7.0 mm of the recorded 52.8 mm body is the terminal block
    beyond the terminal end of the case (17 + 26.3 + 2.5 + 7.0 = 52.8). The schema carries one body box, so the recorded
    body is the 52.8 mm envelope, terminal block included. Hole coordinates are re-expressed in the case-corner frame
    (x=0 at the terminal-block end): terminal-end pair x = 9.5 (2.5 + 7.0), far pair x = 35.8 (52.8 - 17), the same 26.3
    pitch and the same 42.0 and 57.0 pair spans as before, only the origin moved. Along W the 50 mm case is taken as
    centred between the ear pairs (side-ear holes at y = -3.5 and 53.5, 3.5 mm outside the case). That centring is an
    inference, not a measurement: the owner-measured ear tip-to-tip span across W is 63.73 mm and the recorded
    side-ear hole-to-hole span is 57.0 mm, and the inference is that the 3.365 mm of ear beyond each hole (31.865 -
    28.5) is the same on both sides and the 50 mm case sits at the middle. mount_footprint_mm records the resulting
    box: x over the 52.8 mm body (the ears do not extend past the body along L, per the owner''s end-of-case
    measurements), y = 25 +- 31.865 = -6.865 .. 56.865. The y extent inherits the centring inference; the 63.73 mm
    itself is measured. Owner-measured by calipers on
    one unit (medium confidence).'
