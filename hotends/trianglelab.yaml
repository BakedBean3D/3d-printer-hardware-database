    Ceramic heater core, 145W. Max flow 32mm³/s from community testing (MakerMe Blog). Users report >30mm³/s sustained. Ref: makerme.blog/chc-or-rapido
    Re-verified 2026-09-07: trianglelab.net and makerme.blog are both network-egress-blocked in this session. Web search corroborates the 145W heater figure via the trianglelab.net product listing (CHC Pro, Volcano-compatible), but does not surface meltzone or flow-rate numbers independent of the already-cited MakerMe blog post, so 30mm meltzone / 32mm³/s remain unconfirmed estimates. No change made; confidence stays low.
    Re-verified 2026-10-05: trianglelab.net still network-egress-blocked (confirmed again this session, so the actual spec table still cannot be read). NEW CONFLICT found via search snippets (p3d.mx retail listing + a separate general CHC-series description): both give 115W for the heater, not the 145W already on file, and describe max operating temp as "up to 300C", not the 500 recorded in max_temp. Neither snippet is a directly-loaded primary source, so per AGENTS.md this is not averaged or silently applied -- max_temp (500) and the 145W heater figure in notes are left unchanged. Flagging for human review: if 300C is correct, max_temp=500 is a real-world over-temp risk for this entry and should be corrected from a directly-read trianglelab.net page, not from this snippet.
