    Re-verified 2026-09-07: trianglelab.net and makerme.blog are both network-egress-blocked in this session. Web search corroborates the 145W heater figure via the trianglelab.net product listing (CHC Pro, Volcano-compatible), but does not surface meltzone or flow-rate numbers independent of the already-cited MakerMe blog post, so 30mm meltzone / 32mm³/s remain unconfirmed estimates. No change made; confidence stays low.
    Re-verified 2026-09-28: trianglelab.net, makerme.blog, p3d.mx, and west3d.com are all still network-egress-blocked (WebFetch: EGRESS_BLOCKED). This round's WebSearch snippet gives a conflicting heater figure -- "ID09L16 ceramic heater, max power 115W at 24V" -- attributed to the trianglelab.net CHC Pro product page, vs. the 145W already in these notes; heater wattage is descriptive text only (not a schema field here), so this is flagged rather than silently picked, per the two independent unattributed-to-me numbers rule. meltzone_length (30.0) and max_volumetric_flow (32.0) remain the MakerMe-blog estimates from before; no independent corroboration found this round either. No field changes; confidence stays low. A human with unblocked access to trianglelab.net/products/chc-pro-hotend should resolve the 115W vs. 145W conflict and confirm meltzone/flow off the real spec table.
