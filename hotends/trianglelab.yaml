  notes: |-
    Ceramic heater core. Max flow 32mm³/s from community testing (MakerMe Blog). Users report >30mm³/s sustained. Ref: makerme.blog/chc-or-rapido
    Re-verified 2026-09-07: trianglelab.net and makerme.blog are both network-egress-blocked in this session. Web search corroborates the 145W heater figure via the trianglelab.net product listing (CHC Pro, Volcano-compatible), but does not surface meltzone or flow-rate numbers independent of the already-cited MakerMe blog post, so 30mm meltzone / 32mm³/s remain unconfirmed estimates. No change made; confidence stays low.
    Re-verified 2026-09-21: WebFetch is fully egress-blocked this session too (confirmed even for unrelated domains), so sourcing relies on WebSearch snippets only, not directly-loaded pages. Correction: the 145W heater figure above is wrong - two independent tier-2 listings both selling this exact kit (Amazon "115W High-Power CHC Pro Ceramic Heating Core Kit(for CHC Pro 104NT 24V)", https://www.amazon.com/115W-High-Power-Ceramic-Heating-104NT/dp/B0HGX5ZM4Q; and Alibaba "Trianglelab 115W High Power CHC Pro Kit", https://www.alibaba.com/product-introduction/Trianglelab-115W-High-Power-CHC-Pro_1600448977901.html) name it as a 115W kit, and no source found in either pass supports 145W - likely a transcription error when the entry was first written. Corrected the note text; power was never a stored field here so no field changed. meltzone_length (30.0) and max_volumetric_flow (32.0) remain single-sourced estimates from the MakerMe blog - no independent corroboration found this pass either. confidence stays low.
