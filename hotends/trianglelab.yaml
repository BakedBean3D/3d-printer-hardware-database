  confidence: low
  notes: |-
    Extended meltzone CHC variant. 128W ceramic MCH heater, PT1000 sensor. Air-cooled and liquid-cooled versions. Weight 48g verified. Meltzone ~40mm estimated. Flow ~49mm³/s estimated. Max temp ~300°C estimated. Ref: trianglelab.net, west3d.com, geekbuying.com
    Re-verified 2026-09-07: trianglelab.net is network-egress-blocked in this session. Web search corroborates 128W/24V MCH heater, PT1000 sensor, and 48g weight (matches existing "verified" note) via the trianglelab.net product listing. It also surfaced a max_temp of 330°C and a flow figure of ~130mm³/s, but 130mm³/s is implausible for this hotend class (more than double any known consumer high-flow hotend) and is not trusted here per CLAUDE.md's plausibility-check rule - likely a misread/conflated spec rather than a real number, so max_volumetric_flow (49.0) and max_temp (300) are left unchanged rather than "corrected" to an unverifiable and implausible figure. Flagging the conflict for a human to resolve with a directly-loaded source.
    Re-verified 2026-10-12: trianglelab.net, west3d.com, and web.archive.org all still network-egress-blocked. Traced the source of the 330°C/130mm³/s figures flagged last cycle: they come from an AliExpress listing's auto-generated "AI overview" text, which the AliExpress listing itself discloses does not represent the merchant's own verified specification. That confirms last cycle's call to reject those numbers was correct, not just cautious -- they are AI-generated listing copy, not a manufacturer spec. No change made; max_volumetric_flow (49.0) and max_temp (300) stay as estimated; confidence stays low; conflict remains flagged for human review with a directly-loaded trianglelab.net source.
