  notes: |-
    Extended meltzone CHC variant. 128W ceramic MCH heater, PT1000 sensor. Air-cooled and liquid-cooled versions. Weight 48g verified. Meltzone ~40mm estimated. Flow ~49mm³/s estimated. Max temp ~300°C estimated. Ref: trianglelab.net, west3d.com, geekbuying.com
    Re-verified 2026-09-07: trianglelab.net is network-egress-blocked in this session. Web search corroborates 128W/24V MCH heater, PT1000 sensor, and 48g weight (matches existing "verified" note) via the trianglelab.net product listing. It also surfaced a max_temp of 330°C and a flow figure of ~130mm³/s, but 130mm³/s is implausible for this hotend class (more than double any known consumer high-flow hotend) and is not trusted here per CLAUDE.md's plausibility-check rule - likely a misread/conflated spec rather than a real number, so max_volumetric_flow (49.0) and max_temp (300) are left unchanged rather than "corrected" to an unverifiable and implausible figure. Flagging the conflict for a human to resolve with a directly-loaded source.
    Re-verified 2026-09-28: trianglelab.net, west3d.com, and geekbuying.com all still network-egress-blocked (WebFetch: EGRESS_BLOCKED); web.archive.org is also unreachable from this session, so a cached copy could not be checked either. WebSearch this round again returns the same 330°C / ~130mm³/s figures, now attributed across geekbuying.com, aliexpress, and saverissimo.com listings in addition to the 09-07 trianglelab.net snippet -- i.e. the number is widely mirrored, not a one-off typo, which strengthens the case it is what Trianglelab's own marketing states. It is still not adopted here: repeated retailer mirroring of an implausible figure is exactly how a marketing error propagates, and AGENTS.md requires verifying odd values rather than silently fixing them to match a repeated but physically implausible number. max_volumetric_flow stays 49.0 (estimated) and max_temp stays 300 (estimated); confidence stays low. Escalating again for human review: someone with unblocked access to trianglelab.net/products/chc%C2%AE-xl-hotend should confirm whether 330°C/130mm³/s is a genuine (if aggressive) spec or a retailer-propagated error, since the same pair of numbers has now surfaced independently in two separate re-verification passes.
