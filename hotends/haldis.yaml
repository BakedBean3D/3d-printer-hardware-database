- id: red_lizard_k1_hf
  name: Red Lizard K1 HF
  manufacturer: Haldis
  meltzone_length: 30.0
  max_volumetric_flow: 32.0
  max_temp: 500
  recommended_temp_pla: 210
  recommended_temp_abs: 245
  recommended_temp_petg: 240
  nozzle_thread: M6
  weight_g: 50.0
  recommended_max_speed: 150
  confidence: low
  notes: |-
    V6 groovemount. One-piece integrated nozzle+heatbreak. Two variants: standard (320°C) and high-temp (500°C, plated copper). 115W heater. Flow ~32mm³/s estimated. Weight ~50g estimated. Ref: 3dgadgets.my, forum.duet3d.com
    Re-verified 2026-09-07: checked 3dgadgets.my listing, AliExpress/Amazon retail listings, and the Duet3D "anyone seen the new haldis k1 hf hotend?" forum thread again. Retailer snippets are inconsistent with each other (weight quoted as both ~140g and 156g for what claims to be the same SKU, one of which is likely package/shipping weight rather than net hotend weight) and could not be resolved without loading the page directly (3dgadgets.my is network-egress-blocked in this session). Kept existing 50g/32mm³/s estimates rather than substitute an unreliable number; confidence stays low pending a source that can be read directly.
    Re-verified 2026-09-21: WebFetch is fully egress-blocked this session (confirmed against unrelated domains too, not just 3dgadgets.my), so still working from WebSearch snippets only. The ~140g figure recurs again this pass, consistently tied to the Amazon listing (B09HGTT9DW, "Haldis 3D Red Lizard K1 HF ... V6 Hot End", https://www.amazon.com/Haldis-Temperature-Extrusion-Printers-Accessories/dp/B09DK22DG7 and https://www.amazon.com/Haldis-Assembled-Extrusion-Extruder-Printer/dp/B09HGTT9DW) rather than the ~156g figure, but it is still not possible to tell from a search snippet alone whether that Amazon "item weight" is the bare hotend or the boxed/assembled kit incl. wiring and connectors - the stored 50g looks like it assumes the former. FLAGGING FOR HUMAN REVIEW: this is a ~3x spread (50g vs. ~140g) on a field that feeds toolhead mass budgets, and needs someone who can load a retailer page directly (or weigh a unit) to resolve - do not trust either number blindly. Separately, the 3dgadgets.my listing copy (per search synthesis only) advertises the block as reaching "up to 550°C", vs. the 500°C already on file for the high-temp variant; not adopted here since it reads as marketing rounding and the existing 320/500°C two-variant split is internally consistent with the product naming, but noting it in case a directly-loaded datasheet says otherwise. No field values changed; confidence stays low.
