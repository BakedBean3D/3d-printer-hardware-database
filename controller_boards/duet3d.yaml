  mount_pitch_y_mm: null
  mount_hole_count: 2
  mount_holes_xy:
  - - 9.76
    - 13.05
  - - 4.68
    - 13.05
  mount_inset_from_edge_mm: null
  standoff_height_mm: null
  component_height_top_mm: null
  connector_notes: 2x5 (10-pin) 2.54 mm header plugs into Duet expansion/SPI header; screw terminals for
    PT100 wires.
  sources:
  - https://github.com/Duet3D/TempDaughterboards/tree/master/MAXTempRTD
  - https://docs.duet3d.com/Duet3D_hardware/Accessories/PT100_Temperature_Daughterboard
  confidence: high
  notes: 'CORRECTED 2026-07-24: previous record had mount_pitch_x_mm=38.5 with holes at y=0/38.5 -- physically
    impossible (38.5 mm exceeds the 31.74 mm board length AND the 26.16 mm width). Re-extracted directly
    from the official KiCad source (MAXTempRTD.kicad_pcb): footprint P3 (F.Cu) at (72.64456,56.41594) carries
    a non-plated pillar hole at local (0,-19.25066); footprint P4 (B.Cu, MAX_TEMP_DB_inv, rotated 180) at
    (72.64456,51.33594) carries one at local (0,19.25066). Board Edge.Cuts bbox is (59.59856,27.40444)-(85.76056,59.14644)
    = 26.162 x 31.742 mm, confirming pcb_length/width were already correct. Relative to the board corner
    the two pillar holes sit at (13.05, 9.76) and (13.05, 4.68) -- collinear, 5.08 mm apart (exactly 2x
    the 2.54 mm header pitch), NOT 38.5 mm apart. Confidence high — Tier-1 (vendor CAD), holes Ø2.54 mm
    NPTH confirmed. Mounting is a supplied plastic snap-in pillar through these two NPTH holes, not an
    M-screw. Source: https://raw.githubusercontent.com/Duet3D/TempDaughterboards/master/MAXTempRTD/MAXTempRTD.kicad_pcb'
