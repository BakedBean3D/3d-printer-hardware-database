  component_height_top_mm: null
  connector_notes: Mounts behind the Stealthburner front; USB adapter is a separate PCB.
  sources:
  - https://github.com/MotorDynamicsLab/Nitehawk-SB
  - https://github.com/MotorDynamicsLab/Nitehawk-SB/blob/master/Hardware/Nitehawk-SB_V1.5_3D%20Layout.pdf
  - https://docs.ldomotors.com/en/Toolboard/nitehawk-sb
  confidence: low
  notes: 'Confidence low — Tier-3 (unverified — measure before cutting). Mounting is via the Stealthburner
    body, not a board-edge hole pattern. PCB outline + exact hole XY UNVERIFIED -- extract from the repo
    STEP / dimensioned Layout.pdf in CAD, or use the HartK Stealthburner_Toolhead_PCB reference footprint.
    Thickness 1.6 mm is firm. Mounting: Stealthburner toolhead board; form factor "based on HartK''s two-piece
    Stealthburner toolhead PCB" (the de-facto Voron SB toolhead PCB standard). It clips/screws into the
    Stealthburner printed body (M3 into the SB fan housing), NOT a stepper bolt circle or a simple rectangular
    pattern. PCB is 1.6 mm thick (confirmed from STEP z-layer). No KiCad source published; the shipped
    STEP is a full toolhead assembly, so clean outline/hole XY could not be machine-extracted. Source:
    https://github.com/MotorDynamicsLab/Nitehawk-SB'
