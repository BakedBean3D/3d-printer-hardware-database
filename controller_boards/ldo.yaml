    mm thickness are firm; PCB outline, full hole count/pattern, and Y pitch UNVERIFIED. Extract from
    the repo DXF/STEP in CAD before cutting. Often mounted via a printed adapter rather than directly.
    Mounting: Toolhead board for the 36 mm NEMA14 standard; commonly mounted via a printed adapter (repo
    ships Universal/Rigid/Flex, G2SA, WWG2, O2, Orbiter mounts). Two Ø3.2 mm (M3) mounting circles in
    the source geometry are spaced 43.84 mm in X (same toolhead-PCB hole spacing as the Mellow SHT36 --
    a useful cross-check that 43.84 mm is a real standard). PCB 1.6 mm thick (STEP z-layer). Full hole
    set / outline could not be cleanly extracted because the shipped STEP is a full assembly. Source:
    https://github.com/MotorDynamicsLab/Nitehawk-36'
