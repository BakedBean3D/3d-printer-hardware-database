name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate database
        run: python3 scripts/validate.py

      - name: Generated aggregates are in sync
        run: |
          python3 controller_boards/gen.py
          python3 psu/gen.py
          git diff --exit-code

      - name: submit-hardware.sh syntax
        run: bash -n scripts/submit-hardware.sh
